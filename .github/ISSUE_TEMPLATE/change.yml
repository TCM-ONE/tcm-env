name: Feature or platform change
description: Propose a scoped product, infrastructure, migration or governance change.
title: "Change: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem and outcome
      description: What problem are we solving, for whom, and how will success be measured?
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope and non-goals
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Use a testable checklist.
    validations:
      required: true
  - type: textarea
    id: rollout
    attributes:
      label: Risk, rollout and rollback
      description: Include compatibility, migration, abort signals, rollback and owner.
    validations:
      required: true
