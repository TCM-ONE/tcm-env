name: Deploy Backend to OCI VM

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/assets/icon.png"
      - "deploy/backend/**"
      - ".github/workflows/deploy-backend-oci.yml"
  workflow_dispatch:

concurrency:
  group: tcm-backend-deploy
  cancel-in-progress: false

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.OCI_SSH_KEY }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Check backend before touching production
        run: |
          npm ci --workspace=backend --no-audit --no-fund
          node --test backend/test/production.test.js

      - name: Stage and activate release with rollback
        env:
          OCI_USER: ${{ vars.BACKEND_USER || secrets.OCI_USER }}
          OCI_HOST: ${{ vars.BACKEND_HOST || secrets.OCI_HOST }}
        run: |
          set -euo pipefail
          RELEASE="/opt/tcm/releases/$(date -u +%Y%m%d%H%M%S)-${GITHUB_SHA::12}"
          TARGET="$OCI_USER@$OCI_HOST"
          ssh -o StrictHostKeyChecking=accept-new "$TARGET" "sudo install -d -o ubuntu -g ubuntu '$RELEASE'"
          rsync -az --exclude node_modules --exclude .env --exclude uploads \
            -e 'ssh -o StrictHostKeyChecking=accept-new' backend/ "$TARGET:$RELEASE/"
          scp deploy/backend/production.conf deploy/backend/activate.sh "$TARGET:$RELEASE/"
          ssh "$TARGET" "mkdir -p '$RELEASE/assets'"
          scp frontend/assets/icon.png "$TARGET:$RELEASE/assets/icon.png"
          ssh "$TARGET" "cd '$RELEASE' && npm ci --omit=dev --no-audit --no-fund && sudo bash '$RELEASE/activate.sh' '$RELEASE'"
          curl -fsS --max-time 15 https://api.thecodemunk.in/api/health | node -e 'let s="";process.stdin.on("data",c=>s+=c);process.stdin.on("end",()=>{const h=JSON.parse(s);process.exit(h.ok&&h.mongo===1?0:1)})'

      - name: Report deployment status
        if: always()
        continue-on-error: true
        uses: actions/github-script@v9
        env:
          DEPLOY_ENV: tcm-backend
        with:
          script: |
            const state = '${{ job.status }}' === 'success' ? 'success' : 'error';
            const description = `Deploy to OCI backend (${context.sha.slice(0, 7)}): ${'${{ job.status }}'}`;
            const dep = await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.sha,
              environment: process.env.DEPLOY_ENV,
              auto_merge: false,
              required_contexts: [],
            }).catch((e) => { console.log(`createDeployment skipped: ${e.message}`); return null; });
            if (!dep) return;
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: dep.data.id,
              state,
              description,
            }).catch((e) => { console.log(`createDeploymentStatus skipped: ${e.message}`); });
