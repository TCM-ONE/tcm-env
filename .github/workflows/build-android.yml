name: Build Android & Publish (Runner + Email)

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

concurrency:
  group: build-android
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    environment: tcm-mobile-release
    timeout-minutes: 120
    env:
      EXPO_PUBLIC_API_URL: ${{ vars.TCM_API_URL || 'https://api.thecodemunk.in/api' }}
      EXPO_UPDATES_CHANNEL: ${{ startsWith(github.ref, 'refs/tags/') && 'production' || 'preview' }}
      MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
      MAIL_APP_PASSWORD: ${{ secrets.MAIL_APP_PASSWORD }}
      MAIL_TO: ${{ secrets.MAIL_TO || 'cuboidsoft@gmail.com' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Compute app version
        run: echo "TCM_APP_VERSION=$(node -e "console.log(require('./frontend/app.json').expo.version)")" >> "$GITHUB_ENV"

      - name: Verify app version matches release tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$TAG_VERSION" != "$TCM_APP_VERSION" ]; then
            echo "::error::Release tag ${GITHUB_REF_NAME} does not match frontend/app.json version ${TCM_APP_VERSION}. Bump version (and versionCode) in app.json before tagging."
            exit 1
          fi
          echo "tag ${GITHUB_REF_NAME} matches app.json version ${TCM_APP_VERSION}"

      - name: Prepare dist directory
        run: mkdir -p frontend/dist

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Prebuild Android project (generate native project)
        working-directory: frontend
        env:
          CI: 1
          EXPO_NO_TELEMETRY: 1
        run: npx expo prebuild --platform android --no-install

      - name: Write release keystore from secret
        working-directory: frontend
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is not set"
            exit 1
          fi
          if [ -z "$ANDROID_KEYSTORE_PASS" ] || [ -z "$ANDROID_KEY_ALIAS" ]; then
            echo "::error::ANDROID_KEYSTORE_PASS or ANDROID_KEY_ALIAS secret is not set"
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/tcm-release.keystore
          keytool -list -keystore android/app/tcm-release.keystore \
            -storepass "$ANDROID_KEYSTORE_PASS" -alias "$ANDROID_KEY_ALIAS" \
            >/dev/null 2>&1 || {
              echo "::error::Keystore validation failed — ANDROID_KEYSTORE_PASS / ANDROID_KEY_ALIAS may be wrong, or the keystore is corrupt"
              exit 1
            }
          echo "keystore validated"

      - name: Verify keystore matches Firebase OAuth fingerprint
        if: always()
        continue-on-error: true
        working-directory: frontend
        env:
          ANDROID_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: python3 ../.github/scripts/verify-signing-hash.py

      - name: Patch build.gradle with release signing config
        working-directory: frontend
        env:
          ANDROID_KEYSTORE_PATH: android/app/tcm-release.keystore
          ANDROID_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: python3 ../.github/scripts/patch-release-signing.py

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK + AAB (local gradle, no EAS quota)
        working-directory: frontend/android
        run: ./gradlew assembleRelease bundleRelease --no-daemon

      - name: Collect + verify APK + AAB into dist
        working-directory: frontend
        run: |
          set -euo pipefail
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk dist/app-preview.apk
          cp android/app/build/outputs/bundle/release/app-release.aab dist/app-release.aab
          test -s dist/app-preview.apk
          test -s dist/app-release.aab
          echo "APK size: $(stat -c%s dist/app-preview.apk) bytes"
          echo "AAB size: $(stat -c%s dist/app-release.aab) bytes"
          ls -lh dist

      - name: Verify APK + AAB signatures
        working-directory: frontend
        run: |
          set -euo pipefail
          APKSIGNER="$(find "${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}/build-tools" -maxdepth 1 -type d -name '3*' | sort -V | tail -n1)/apksigner"
          "$APKSIGNER" verify --print-certs dist/app-preview.apk
          "$APKSIGNER" verify dist/app-preview.apk
          curl -fsSL -o /tmp/bundletool.jar https://github.com/google/bundletool/releases/download/1.18.2/bundletool-all-1.18.2.jar
          java -jar /tmp/bundletool.jar validate --bundle=dist/app-release.aab
          echo "APK + AAB signatures verified"

      - name: Install verified SSH host key
        env:
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          OCI_HOST: ${{ vars.BACKEND_HOST }}
        run: |
          set -euo pipefail
          test -n "$SSH_KNOWN_HOSTS"
          test -n "$OCI_HOST"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          ssh-keygen -F "$OCI_HOST" -f ~/.ssh/known_hosts >/dev/null

      - name: Set up SSH agent for OCI VM
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.OCI_SSH_KEY }}

      - name: Push APK + AAB to OCI VM (atomic)
        env:
          OCI_HOST: ${{ vars.BACKEND_HOST }}
          OCI_USER: ${{ vars.BACKEND_USER }}
        run: |
          set -euo pipefail
          HOST="$OCI_HOST"
          USER="$OCI_USER"
          ssh -o StrictHostKeyChecking=yes "$USER@$HOST" 'mkdir -p /opt/tcm/dist && rm -rf /opt/tcm/dist/.upload-'
          scp -q -o StrictHostKeyChecking=yes frontend/dist/app-preview.apk "$USER@$HOST:/opt/tcm/dist/.upload-app-preview.apk"
          scp -q -o StrictHostKeyChecking=yes frontend/dist/app-release.aab "$USER@$HOST:/opt/tcm/dist/.upload-app-release.aab"
          ssh -q -o StrictHostKeyChecking=yes "$USER@$HOST" 'cd /opt/tcm/dist && mv -f .upload-app-preview.apk app-preview.apk && mv -f .upload-app-release.aab app-release.aab'

      - name: Publish to GitHub Release (temporary hosting)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            RELEASE_TAG="${GITHUB_REF_NAME}"
          else
            RELEASE_TAG="v${TCM_APP_VERSION}"
          fi
          echo "RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"
          gh release delete "$RELEASE_TAG" --yes --cleanup-tag --repo "$GITHUB_REPOSITORY" 2>/dev/null || true
          gh release create "$RELEASE_TAG" \
            frontend/dist/app-preview.apk \
            frontend/dist/app-release.aab \
            --repo "$GITHUB_REPOSITORY" \
            --title "TCM Android Build ${{ env.TCM_APP_VERSION || '0.1.0' }}" \
            --notes "TCM Android APK + AAB build. App version: ${{ env.TCM_APP_VERSION || '0.1.0' }}."

      - name: Publish APK to Firebase App Distribution
        env:
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_TESTER_GROUP: ${{ vars.FIREBASE_TESTER_GROUP }}
        run: |
          set -euo pipefail
          if [ -z "${FIREBASE_SERVICE_ACCOUNT:-}" ] || [ -z "${FIREBASE_APP_ID:-}" ]; then
            echo "::error::FIREBASE_SERVICE_ACCOUNT or FIREBASE_APP_ID secret is missing — testers will not receive the APK"
            exit 1
          fi
          echo "$FIREBASE_SERVICE_ACCOUNT" > /tmp/firebase-sa.json
          trap 'rm -f /tmp/firebase-sa.json' EXIT
          GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json npx -y firebase-tools appdistribution:distribute frontend/dist/app-preview.apk \
            --app "$FIREBASE_APP_ID" \
            --groups "${FIREBASE_TESTER_GROUP:-testers}" \
            --release-notes "TCM Android build v${TCM_APP_VERSION:-0.1.0}"

      - name: Mint one-time secret download links
        env:
          OCI_USER: ${{ vars.BACKEND_USER }}
          OCI_HOST: ${{ vars.BACKEND_HOST }}
        run: |
          set -euo pipefail
          HOST="$OCI_HOST"
          USER="$OCI_USER"
          mint_link() {
            local file="$1"
            ssh -q -o StrictHostKeyChecking=yes "$USER@$HOST" \
              "DL_TOKEN=\$(sudo grep '^DL_ADMIN_TOKEN=' /opt/tcm/dl-server/.env | cut -d= -f2-) && \
               curl -fsS --max-time 15 -X POST \
                 -H \"X-DL-Admin: \$DL_TOKEN\" \
                 -H 'Content-Type: application/json' \
                 -d '{\"file\":\"$file\"}' \
                 https://api.thecodemunk.in/dl/_mint" | \
              sed -n 's/.*"url":"\([^"]*\)".*/\1/p'
          }
          APK_URL="$(mint_link app-preview.apk)"
          AAB_URL="$(mint_link app-release.aab)"
          test -n "$APK_URL" || { echo "failed to mint APK link"; exit 1; }
          test -n "$AAB_URL" || { echo "failed to mint AAB link"; exit 1; }
          echo "APK_URL=$APK_URL" >> "$GITHUB_ENV"
          echo "AAB_URL=$AAB_URL" >> "$GITHUB_ENV"
          echo "minted one-time links:"
          echo "  $APK_URL"
          echo "  $AAB_URL"

      - name: Email build notification with install + download links
        if: env.MAIL_APP_PASSWORD != ''
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ env.MAIL_USERNAME }}
          password: ${{ env.MAIL_APP_PASSWORD }}
          from: ${{ env.MAIL_USERNAME }}
          to: ${{ env.MAIL_TO }}
          subject: TCM Android build ${{ env.TCM_APP_VERSION || '0.1.0' }} ready (APK + AAB)
          body: |
            TCM Android build complete.

            App version: ${{ env.TCM_APP_VERSION || '0.1.0' }}

            IMPORTANT:
            - app-preview.apk is the INSTALLABLE app. Download this to install on a phone.
            - app-release.aab is the PLAY STORE upload file only — it CANNOT be installed
              directly on a device (if you install that, the app won't open).
            - Each OCI VM link below is SECRET + SINGLE-USE: it works exactly ONCE, then
              expires. If it says "token already used", run a new build to get fresh links.

            Download links:
            - APK (installable) - one-time link: ${{ env.APK_URL }}
            - AAB (Play upload only) - one-time link: ${{ env.AAB_URL }}
            - GitHub Release (works while logged in): https://github.com/${{ github.repository }}/releases/tag/${{ env.RELEASE_TAG || 'latest' }}

            Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

      - name: Email failure notification
        if: failure() && env.MAIL_APP_PASSWORD != ''
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ env.MAIL_USERNAME }}
          password: ${{ env.MAIL_APP_PASSWORD }}
          from: ${{ env.MAIL_USERNAME }}
          to: ${{ env.MAIL_TO }}
          subject: "TCM Android build FAILED (${{ env.TCM_APP_VERSION || '0.1.0' }})"
          body: |
            TCM Android build failed.

            Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            Branch: ${{ github.ref_name }}
