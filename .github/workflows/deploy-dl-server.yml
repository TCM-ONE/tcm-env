name: Deploy dl-server (one-time download links)

on:
  push:
    branches: [main]
    paths:
      - "dl-server/**"
      - ".github/workflows/deploy-dl-server.yml"
  workflow_dispatch:

concurrency:
  group: tcm-dl-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: tcm-backend
    steps:
      - uses: actions/checkout@v7

      - name: Install verified SSH host key
        env:
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ vars.BACKEND_HOST }}
        run: |
          set -euo pipefail
          test -n "$SSH_KNOWN_HOSTS"
          test -n "$DEPLOY_HOST"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          ssh-keygen -F "$DEPLOY_HOST" -f ~/.ssh/known_hosts >/dev/null

      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.OCI_SSH_KEY }}

      - name: Show current Caddyfile (before change)
        env:
          OCI_USER: ${{ vars.BACKEND_USER }}
          OCI_HOST: ${{ vars.BACKEND_HOST }}
        run: |
          ssh -o StrictHostKeyChecking=yes "$OCI_USER@$OCI_HOST" \
            "echo '-- current Caddyfile --'; sudo cat /etc/caddy/Caddyfile 2>/dev/null || echo 'no Caddyfile found'"

      - name: Sync dl-server source + provision env
        env:
          OCI_USER: ${{ vars.BACKEND_USER }}
          OCI_HOST: ${{ vars.BACKEND_HOST }}
          DL_ADMIN_TOKEN: ${{ secrets.DL_ADMIN_TOKEN }}
        run: |
          set -euo pipefail
          ssh -o StrictHostKeyChecking=yes "$OCI_USER@$OCI_HOST" \
            "sudo mkdir -p /opt/tcm/dl-server && sudo chown $OCI_USER /opt/tcm/dl-server"
          rsync -avz --delete --exclude 'node_modules' \
            -e "ssh -o StrictHostKeyChecking=yes" \
            ./dl-server/ "$OCI_USER@$OCI_HOST:/opt/tcm/dl-server/"
          printf 'DL_PORT=5200\nDL_ADMIN_TOKEN=%s\nDL_DIST_DIR=/opt/tcm/dist\nDL_TOKENS_FILE=/opt/tcm/dl-server/tokens.json\nDL_BASE_URL=https://api.thecodemunk.in/dl\n' \
            "$DL_ADMIN_TOKEN" > /tmp/tcm-dl.env
          scp -q -o StrictHostKeyChecking=yes /tmp/tcm-dl.env "$OCI_USER@$OCI_HOST:/tmp/tcm-dl.env"
          ssh -q -o StrictHostKeyChecking=yes "$OCI_USER@$OCI_HOST" \
            "sudo mv /tmp/tcm-dl.env /opt/tcm/dl-server/.env && sudo chown root:root /opt/tcm/dl-server/.env && sudo chmod 600 /opt/tcm/dl-server/.env && echo 'DL_ENV_WRITTEN'"

      - name: Install deps + write systemd unit + start service
        env:
          OCI_USER: ${{ vars.BACKEND_USER }}
          OCI_HOST: ${{ vars.BACKEND_HOST }}
          SYSTEMD_UNIT: |-
            [Unit]
            Description=TCM one-time download link server
            After=network.target

            [Service]
            Type=simple
            User=root
            WorkingDirectory=/opt/tcm/dl-server
            EnvironmentFile=/opt/tcm/dl-server/.env
            ExecStart=/usr/bin/node server.js
            Restart=always
            RestartSec=3
            NoNewPrivileges=true

            [Install]
            WantedBy=multi-user.target
        run: |
          set -euo pipefail
          printf '%s\n' "$SYSTEMD_UNIT" > /tmp/tcm-dl.service
          scp -q -o StrictHostKeyChecking=yes /tmp/tcm-dl.service "$OCI_USER@$OCI_HOST:/tmp/tcm-dl.service"
          ssh -o StrictHostKeyChecking=yes "$OCI_USER@$OCI_HOST" 'sudo bash -s' <<'UNIT'
          set -euo pipefail
          cd /opt/tcm/dl-server
          if [ -f package.json ]; then npm ci --omit=dev --no-audit --no-fund 2>/dev/null || true; fi
          sudo mv /tmp/tcm-dl.service /etc/systemd/system/tcm-dl.service
          sudo systemctl daemon-reload
          sudo systemctl enable tcm-dl
          sudo systemctl restart tcm-dl
          sleep 2
          systemctl is-active tcm-dl
          echo "DL_SERVICE_STARTED"
          UNIT

      - name: Rewrite Caddyfile (remove basic-auth, proxy /dl to tcm-dl) + reload
        env:
          OCI_USER: ${{ vars.BACKEND_USER }}
          OCI_HOST: ${{ vars.BACKEND_HOST }}
          CADDYFILE: |-
            api.thecodemunk.in {
                encode gzip

                handle /dl/* {
                    uri strip_prefix /dl
                    reverse_proxy 127.0.0.1:5200
                }

                handle {
                    reverse_proxy 127.0.0.1:5000
                }
            }

            http://140.245.209.147 {
                encode gzip

                handle /dl/* {
                    uri strip_prefix /dl
                    reverse_proxy 127.0.0.1:5200
                }

                handle {
                    reverse_proxy 127.0.0.1:5000
                }
            }
        run: |
          set -euo pipefail
          printf '%s\n' "$CADDYFILE" > /tmp/tcm-Caddyfile
          scp -q -o StrictHostKeyChecking=yes /tmp/tcm-Caddyfile "$OCI_USER@$OCI_HOST:/tmp/tcm-Caddyfile"
          ssh -o StrictHostKeyChecking=yes "$OCI_USER@$OCI_HOST" 'sudo bash -s' <<'CADDY'
          set -euo pipefail
          TS=$(date +%s)
          sudo cp /etc/caddy/Caddyfile "/etc/caddy/Caddyfile.bak.$TS"
          echo "backed up Caddyfile to Caddyfile.bak.$TS"
          sudo mv /tmp/tcm-Caddyfile /etc/caddy/Caddyfile
          sudo caddy validate --config /etc/caddy/Caddyfile
          sudo systemctl reload caddy
          sleep 2
          systemctl is-active caddy
          echo "CADDY_RELOADED"
          CADDY

      - name: Verify one-time link end-to-end
        env:
          OCI_USER: ${{ vars.BACKEND_USER }}
          OCI_HOST: ${{ vars.BACKEND_HOST }}
        run: |
          set -euo pipefail
          ssh -o StrictHostKeyChecking=yes "$OCI_USER@$OCI_HOST" 'sudo bash -s' <<'VERIFY'
          set -euo pipefail
          echo "=== tcm-dl service ==="
          systemctl is-active tcm-dl
          echo "=== mint via admin endpoint (through Caddy, https) ==="
          TOKEN=$(grep '^DL_ADMIN_TOKEN=' /opt/tcm/dl-server/.env | cut -d= -f2-)
          MINT=$(curl -fsS --max-time 10 -X POST \
            -H "X-DL-Admin: $TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"file":"app-preview.apk"}' \
            https://api.thecodemunk.in/dl/_mint)
          echo "mint response: $MINT"
          URL=$(echo "$MINT" | sed -n 's/.*"url":"\([^"]*\)".*/\1/p')
          echo "=== first download (must succeed) ==="
          C1=$(curl -sS -o /tmp/dl-test1.apk -w "%{http_code}" --max-time 120 "$URL")
          S1=$(stat -c%s /tmp/dl-test1.apk 2>/dev/null || echo 0)
          echo "first: HTTP $C1 size=$S1"
          test "$C1" = "200"
          test "$S1" -gt 1000000
          echo "=== second download (must be 410) ==="
          C2=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 30 "$URL")
          echo "second: HTTP $C2"
          test "$C2" = "410"
          echo "=== third download (must be 410) ==="
          C3=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 30 "$URL")
          echo "third: HTTP $C3"
          test "$C3" = "410"
          echo "=== no token -> 403 ==="
          C4=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 10 "https://api.thecodemunk.in/dl/app-preview.apk")
          echo "no-token: HTTP $C4"
          test "$C4" = "403"
          echo "=== bad admin token -> 401 ==="
          C5=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 10 -X POST \
            -H "X-DL-Admin: wrong" \
            -H "Content-Type: application/json" \
            -d '{"file":"app-preview.apk"}' \
            https://api.thecodemunk.in/dl/_mint)
          echo "bad-admin: HTTP $C5"
          test "$C5" = "401"
          echo "DL_VERIFY_OK"
          VERIFY
