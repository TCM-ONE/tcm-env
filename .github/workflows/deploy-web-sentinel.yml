name: Deploy Expo Web to Cyber Sentinel

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "package.json"
      - "package-lock.json"
      - "deploy/sentinel/**"
      - ".github/workflows/deploy-web-sentinel.yml"
  workflow_dispatch:

concurrency:
  group: tcm-web-sentinel-deploy
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: app-thecodemunk-in
    timeout-minutes: 30
    env:
      EXPO_PUBLIC_API_URL: https://api.thecodemunk.in/api
      SENTINEL_HOST: ${{ vars.SENTINEL_HOST || '140.245.249.14' }}
      SENTINEL_USER: ${{ vars.SENTINEL_USER || 'ubuntu' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Export production web app
        working-directory: frontend
        env:
          CI: 1
          EXPO_NO_TELEMETRY: 1
          EXPO_PUBLIC_API_URL: https://api.thecodemunk.in/api
        run: npx expo export --platform web --output-dir ../web-dist

      - name: Verify web export
        run: |
          set -euo pipefail
          test -s web-dist/index.html
          test -d web-dist/_expo/static/js/web
          grep -rq 'api.thecodemunk.in/api' web-dist/_expo/static/js/web || grep -rq 'thecodemunk' web-dist/_expo/static/js/web
          echo "Verified $(du -sh web-dist | cut -f1) production export"

      - name: Set up deployment SSH key
        env:
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$SSH_KNOWN_HOSTS"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          ssh-keygen -F "$SENTINEL_HOST" -f ~/.ssh/known_hosts >/dev/null

      - name: Load deployment SSH key
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.OCI_SSH_KEY }}

      - name: Deploy versioned release atomically
        run: |
          set -euo pipefail
          RELEASE="$(date -u +%Y%m%d%H%M%S)-${GITHUB_SHA::12}"
          TARGET="$SENTINEL_USER@$SENTINEL_HOST"
          SSH_OPTS="-o StrictHostKeyChecking=yes -o ConnectTimeout=15"

          ssh $SSH_OPTS "$TARGET" \
            "sudo install -d -m 755 -o '$SENTINEL_USER' -g '$SENTINEL_USER' /var/www/tcm-web/releases/$RELEASE"

          rsync -az --delete --delay-updates \
            -e "ssh $SSH_OPTS" \
            web-dist/ "$TARGET:/var/www/tcm-web/releases/$RELEASE/"

          scp $SSH_OPTS deploy/sentinel/Caddyfile \
            "$TARGET:/tmp/tcm-web-Caddyfile"
          scp $SSH_OPTS deploy/sentinel/admin.Caddyfile \
            "$TARGET:/tmp/tcm-admin-Caddyfile"

          ssh $SSH_OPTS "$TARGET" "RELEASE='$RELEASE' sudo -E bash -s" <<'REMOTE'
          set -euo pipefail
          test -s "/var/www/tcm-web/releases/$RELEASE/index.html"
          find "/var/www/tcm-web/releases/$RELEASE/_expo/static/js/web" \
            -type f -name '*.js' -size +100k -print -quit | grep -q .

          install -d -m 755 /etc/caddy/conf.d
          install -m 644 /tmp/tcm-admin-Caddyfile /etc/caddy/conf.d/tcm-admin.Caddyfile
          install -m 644 /tmp/tcm-web-Caddyfile /etc/caddy/Caddyfile
          caddy fmt --overwrite /etc/caddy/Caddyfile
          caddy fmt --overwrite /etc/caddy/conf.d/tcm-admin.Caddyfile
          caddy validate --config /etc/caddy/Caddyfile

          ln -sfn "/var/www/tcm-web/releases/$RELEASE" /var/www/tcm-web/current
          systemctl reload caddy
          systemctl is-active --quiet caddy
          curl -fsS --max-time 10 http://127.0.0.1/ | grep -qi '<div id="root">'
          curl -fsS --max-time 15 --resolve app.thecodemunk.in:443:127.0.0.1 https://app.thecodemunk.in/ | grep -qi '<div id="root">'

          find /var/www/tcm-web/releases -mindepth 1 -maxdepth 1 -type d \
            -printf '%T@ %p\n' | sort -rn | awk 'NR > 5 {print $2}' | xargs -r rm -rf
          echo "DEPLOYED_RELEASE=$RELEASE"
          REMOTE

      - name: Verify public deployment
        run: |
          set -euo pipefail
          for attempt in $(seq 1 12); do
            if curl -fsS --max-time 15 "http://$SENTINEL_HOST/" | grep -qi '<div id="root">'; then
              echo "PUBLIC_WEB_OK after $attempt attempts"
              curl -fsS --max-time 15 --resolve app.thecodemunk.in:443:"$SENTINEL_HOST" https://app.thecodemunk.in/ | grep -qi '<div id="root">'
              echo "PUBLIC_HTTPS_OK"
              exit 0
            fi
            sleep 5
          done
          echo "Public web verification failed"
          exit 1
