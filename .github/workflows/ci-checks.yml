name: CI Checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-health:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install backend dependencies
        run: npm ci --workspace=backend

      - name: Production persistence and startup regression checks
        run: node --test backend/test/production.test.js

      - name: Verify standalone deployment lockfile
        working-directory: backend
        run: npm ci --workspaces=false --omit=dev --ignore-scripts --no-audit --no-fund

      - name: Backend health check (in-memory fallback)
        run: |
          set -e
          node backend/src/server.js > backend-server.log 2>&1 &
          NODE_PID=$!
          cleanup() {
            kill "$NODE_PID" 2>/dev/null || true
          }
          trap cleanup EXIT
          for i in $(seq 1 15); do
            if curl -fsS --max-time 5 http://localhost:5000/api/health | grep -q '"ok":true'; then
              echo "HEALTH_OK after $i polls"
              exit 0
            fi
            sleep 2
          done
          echo "health check failed after 30s"
          cat backend-server.log
          exit 1

  frontend-bundle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci --workspace=frontend

      - name: Export Android bundle
        working-directory: frontend
        env:
          CI: true
          EXPO_NO_TELEMETRY: 1
          EXPO_PUBLIC_API_URL: ${{ vars.TCM_API_URL || 'https://api.thecodemunk.in/api' }}
        run: npx expo export --platform android

  frontend-web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci --workspace=frontend

      - name: Export production web app
        working-directory: frontend
        env:
          CI: true
          EXPO_NO_TELEMETRY: 1
          EXPO_PUBLIC_API_URL: https://api.thecodemunk.in/api
        run: npx expo export --platform web --output-dir ../web-dist-check

      - name: Verify web output
        run: |
          test -s web-dist-check/index.html
          find web-dist-check/_expo/static/js/web -type f -name '*.js' -size +100k -print -quit | grep -q .

  admin-dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin-dashboard
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: admin-dashboard/package-lock.json

      - name: Install dashboard dependencies
        run: npm ci

      - name: Build dashboard
        run: npm run build

      - name: Verify dashboard output
        run: test -s dist/index.html

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Audit deployed backend dependencies
        working-directory: backend
        run: npm audit --omit=dev --workspaces=false

      - name: Report frontend build-tool advisories
        run: |
          set -o pipefail
          npm audit --omit=dev --workspace=frontend || {
            echo "Frontend audit contains the documented Metro/image-size advisory; no patched release is currently available."
            exit 0
          }
